name: Update LeetCode stats

on:
  schedule:
    # 13:00 UTC daily (~9am ET)
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats from LeetCode
        run: |
          curl -s -X POST https://leetcode.com/graphql \
            -H "Content-Type: application/json" \
            --data '{"query":"query userPublicProfile($username: String!) { matchedUser(username: $username) { submitStats { acSubmissionNum { difficulty count } } profile { ranking } } }","variables":{"username":"mananvp__59"}}' \
            -o /tmp/leetcode-raw.json

      - name: Write data/leetcode.json
        run: |
          python3 - <<'EOF'
          import json
          import datetime

          with open('/tmp/leetcode-raw.json') as f:
              raw = json.load(f)

          user = raw['data']['matchedUser']
          counts = {s['difficulty']: s['count'] for s in user['submitStats']['acSubmissionNum']}

          out = {
              "username": "mananvp__59",
              "updated": datetime.date.today().isoformat(),
              "solved": counts.get('All', 0),
              "easy": counts.get('Easy', 0),
              "medium": counts.get('Medium', 0),
              "hard": counts.get('Hard', 0),
              "ranking": user['profile']['ranking'],
          }

          with open('data/leetcode.json', 'w') as f:
              json.dump(out, f, indent=2)
              f.write('\n')
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leetcode.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update LeetCode stats"
            git push
          else
            echo "No change in stats."
          fi
